# Clippy lint configuration for Lance.
# Thresholds are stated explicitly so the quality gate is reproducible; they
# currently match Clippy's defaults (excessive nesting 0, lines 100,
# arguments 7, type complexity 250).
excessive-nesting-threshold = 0
too-many-lines-threshold = 100
too-many-arguments-threshold = 7
type-complexity-threshold = 250
