<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/src-tauri/icons/icon.png" />
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=syne:400,600,700,800|inter:400,500|jetbrains-mono:400,500&display=swap" rel="stylesheet">
    <script>
      // Pre-paint theme: kills the light-flash for dark-mode users on cold
      // start. Mirrors the App effect below (stored mode, else OS setting).
      // App persists lance:theme-mode on every resolve, so this converges.
      try {
        var m = localStorage.getItem('lance:theme-mode');
        if (m !== 'dark' && m !== 'light') {
          m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (m === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
