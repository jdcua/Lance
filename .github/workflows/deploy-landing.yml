name: Deploy landing

# The public site (landing + /try/ + download/updater APIs) is a Worker with
# static assets, deployed with wrangler. There is no Pages Git integration, so
# without this workflow the site silently goes stale on every push (it served
# a deleted 0.9.3 local build for weeks in Oct 2026). This keeps it current.
#
# Setup (one time): add two repository secrets (Settings → Secrets and
# variables → Actions), then push to main:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit + Workers KV:Edit
#                          (create at dash.cloudflare.com → My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID  from any `wrangler whoami` output or the dashboard URL
# Until both exist this workflow fails fast with a clear error and changes nothing.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/build-trial.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The /try/ build is served publicly from Cloudflare, and unlike the
      # desktop build there is no Rust layer to fall back on: browser mode calls
      # the license worker directly (src/store/index.ts) and, with no URL baked
      # in, fell back to the https://lance-license.your-subdomain.workers.dev
      # placeholder. That made every browser activation fail its online check and
      # silently assume 'pro' instead of recording the real tier.
      #
      # Checkout needs the same treatment: PADDLE_CHECKOUT_URL and the three
      # price IDs are only wired into release.yml, so every buy button in the
      # browser trial reported "Checkout is not configured in this build".
      #
      # These are public values by design (price IDs are in the shipped binary
      # already, and the worker URL is not a credential). The license worker
      # still requires a valid signature on every webhook, so exposing its URL
      # grants nothing.
      - name: Build trial
        env:
          VITE_LICENSE_WORKER_URL: ${{ secrets.LANCE_LICENSE_WORKER_URL }}
          VITE_PADDLE_CHECKOUT_URL: ${{ secrets.PADDLE_CHECKOUT_URL }}
          VITE_PADDLE_MONTHLY_PRICE_ID: ${{ secrets.PADDLE_MONTHLY_PRICE_ID }}
          VITE_PADDLE_YEARLY_PRICE_ID: ${{ secrets.PADDLE_YEARLY_PRICE_ID }}
          VITE_PADDLE_ONETIME_PRICE_ID: ${{ secrets.PADDLE_ONETIME_PRICE_ID }}
        run: npm run build:trial

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::CLOUDFLARE_API_TOKEN secret is not set."; missing=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set."; missing=1; }
          exit $missing

      - name: Deploy landing worker
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Pasted secrets often carry a trailing space/newline, which
          # wrangler rejects ("may only contain alphanumeric characters").
          # Trim before use rather than failing the deploy on whitespace.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          unset CLOUDFLARE_API_TOKEN_RAW CLOUDFLARE_ACCOUNT_ID_RAW
          npx -y wrangler@4.147.0 deploy
