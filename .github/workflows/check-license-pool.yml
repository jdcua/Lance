name: Check license key pool

# The license key pool is what fulfillment draws from. When it is empty, a
# paying customer gets nothing: the worker writes pending:, answers 503 so
# Paddle keeps retrying, and emails the owner. In Oct 2026 a real $14.70
# purchase sat unfulfilled for hours because the pool was empty and nothing
# surfaced it. `wrangler kv key list` compounded that by serving phantom pool
# entries from a stale local cache.
#
# This reads pool size from the LIVE worker over /admin/kv, which cannot be
# fooled that way, and raises a GitHub issue so the shortfall is visible
# without anyone running a command. It does not mint: keys are a 1-in-1e9
# HMAC brute force that needs the plaintext LANCE_LICENSE_SECRET, which
# lives only on the owner's machine by design. Minting belongs on a laptop
# with cores, not on a 2-core CI runner.
#
# Requires the LICENSE_ADMIN_TOKEN repo secret (same value as the worker's
# ADMIN_TOKEN).

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Every 6 hours: '17' avoids the top-of-hour stampede on GitHub's
    # scheduler, which delays scheduled jobs by several minutes.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Warn below this many keys'
        required: false
        default: '10'

concurrency:
  group: check-license-pool
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read live pool size
        id: pool
        env:
          ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
          THRESHOLD: ${{ github.event.inputs.threshold || '10' }}
        run: |
          set -euo pipefail
          base="https://lance-license.cuajuandiego.workers.dev"

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::LICENSE_ADMIN_TOKEN is not set. Cannot read pool size."
            exit 1
          fi

          body=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$base/admin/kv?prefix=pool%3A")

          if ! printf '%s' "$body" | grep -q '"keys"'; then
            echo "::error::Unexpected /admin/kv response: $body"
            exit 1
          fi

          # grep -c exits 1 on zero matches, which under pipefail would abort
          # the step. Zero is the case that matters most, so tolerate it.
          count=$(printf '%s' "$body" | tr ',' '\n' | grep -c '"name"' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"

          echo "Pool keys available: $count (warn below $THRESHOLD)"

          if [ "$count" -lt "$THRESHOLD" ]; then
            echo "short=true" >> "$GITHUB_OUTPUT"
            echo "::warning::License key pool is low at $count keys."
          else
            echo "short=false" >> "$GITHUB_OUTPUT"
            echo "Pool is healthy."
          fi

      - name: Raise or update an issue when the pool is short
        if: steps.pool.outputs.short == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit target: without a checkout step there is no git repo, and
          # `gh issue` then fails with "fatal: not a git repository".
          REPO: ${{ github.repository }}
          COUNT: ${{ steps.pool.outputs.count }}
          THRESHOLD: ${{ steps.pool.outputs.threshold }}
        run: |
          set -euo pipefail
          title="License key pool low: ${COUNT} keys remaining"

          # Reuse the open issue instead of filing a new one every 6 hours.
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title | startswith(\"License key pool low\")) | .number" | head -1)

          body=$(cat <<EOF
          The live license key pool has **${COUNT} key(s)**, below the warn threshold of ${THRESHOLD}.

          Purchases still fulfill while at least one key remains. At **zero**, a paying
          customer receives nothing: the worker writes \`pending:\`, returns 503 so Paddle
          keeps retrying, and emails the owner. Nothing self-heals.

          ## Top up

          Keys require the plaintext \`LANCE_LICENSE_SECRET\`, which is write-only on the
          worker and in GitHub by design, so minting must run on a machine with cores.
          GitHub-hosted runners have 2, roughly 9x slower than a laptop.

          \`\`\`bash
          cd /path/to/Lance
          read -s LANCE_LICENSE_SECRET && export LANCE_LICENSE_SECRET
          nohup node scripts/generate-license.cjs --count 25 > /tmp/mint.log 2>&1 &
          unset LANCE_LICENSE_SECRET
          \`\`\`

          Roughly 2-4 minutes per key. Each key uploads as it is minted, so an
          interrupted run is not wasted.

          ## Verify against the live worker

          Do not trust \`wrangler kv key list\`. It has served phantom pool entries from a
          stale local cache, which hid an entirely empty pool before.

          \`\`\`bash
          curl -H "Authorization: Bearer \$ADMIN_TOKEN" \\
            "https://lance-license.cuajuandiego.workers.dev/admin/kv?prefix=pool%3A"
          \`\`\`

          ## Then clear this issue

          \`\`\`bash
          curl -X POST -H "Authorization: Bearer \$ADMIN_TOKEN" \\
            https://lance-license.cuajuandiego.workers.dev/admin/fulfill
          \`\`\`

          That endpoint also completes any purchase waiting in \`pending:\`.

          ---
          _Opened automatically by check-license-pool.yml. Updated in place while open._
          EOF
          )

          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            echo "Opening new issue"
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label ops 2>/dev/null \
              || gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Summary
        env:
          COUNT: ${{ steps.pool.outputs.count }}
        run: |
          {
            echo "### License key pool"
            echo
            echo "Keys available: **${COUNT}**"
            echo
            echo "Checked $(date -u +'%Y-%m-%d %H:%M UTC') against the live worker."
          } >> "$GITHUB_STEP_SUMMARY"
