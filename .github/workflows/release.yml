name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Sanitize signing key
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d ' \t\r')
          echo "TAURI_SIGNING_PRIVATE_KEY_CLEAN<<EOF" >> "$GITHUB_ENV"
          echo "$KEY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY_CLEAN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LANCE_LICENSE_SECRET: ${{ secrets.LANCE_LICENSE_SECRET }}
          # License worker URL for online validation (GitHub Secret LANCE_LICENSE_WORKER_URL).
          # Empty/missing falls back to the placeholder and only offline HMAC applies.
          LANCE_LICENSE_WORKER_URL: ${{ secrets.LANCE_LICENSE_WORKER_URL }}
          # Paddle price IDs are baked in at build time (Vite). Without these,
          # every checkout button in the shipped app reports "not configured".
          VITE_PADDLE_MONTHLY_PRICE_ID: ${{ secrets.PADDLE_MONTHLY_PRICE_ID }}
          VITE_PADDLE_YEARLY_PRICE_ID: ${{ secrets.PADDLE_YEARLY_PRICE_ID }}
          VITE_PADDLE_ONETIME_PRICE_ID: ${{ secrets.PADDLE_ONETIME_PRICE_ID }}
          VITE_PADDLE_CHECKOUT_URL: ${{ secrets.PADDLE_CHECKOUT_URL }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          BUNDLE="src-tauri/target/release/bundle"
          if [ -d "$BUNDLE" ]; then
            find "$BUNDLE" -type f \( \
              -name '*.AppImage' -o -name '*.AppImage.sig' \
              -o -name '*.deb' -o -name '*.deb.sig' \
              -o -name '*.dmg' \
              -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
              -o -name '*.msi' -o -name '*.msi.sig' \
              -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            \) -exec cp {} dist-artifacts/ \;
            ls -la dist-artifacts/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        run: node scripts/generate-latest-json.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}

      - name: Get tag message
        id: tagmsg
        run: |
          MESSAGE=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" | head -c 10000)
          if [ -z "$MESSAGE" ]; then
            MESSAGE="See changelog for details"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lance ${{ github.ref_name }}
          body: ${{ steps.tagmsg.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
            latest.json
