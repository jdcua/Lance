name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify-ci:
    name: Verify CI passed on main
    runs-on: ubuntu-latest
    steps:
      - name: Check commit CI status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECK_RUNS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Typecheck" or .name == "Lint" or .name == "Rust (check + clippy + fmt)") | .conclusion]')
          echo "Check run conclusions for this commit: $CHECK_RUNS"
          if echo "$CHECK_RUNS" | grep -qv '"success"'; then
            echo "::error::One or more required CI checks have not passed on this commit."
            echo "::error::Ensure CI passes on main before tagging a release."
            exit 1
          fi
          echo "All required CI checks passed."

  build:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          if [ -d src-tauri/target/release/bundle ]; then
            cp -r src-tauri/target/release/bundle/* dist-artifacts/ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        run: node scripts/generate-latest-json.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}

      - name: Get tag message
        id: tagmsg
        run: |
          MESSAGE=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" | head -c 10000)
          if [ -z "$MESSAGE" ]; then
            MESSAGE="See changelog for details"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lance ${{ github.ref_name }}
          body: ${{ steps.tagmsg.outputs.body }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
            latest.json
