name: Laya Gate

# Explicit read-only. Without this the workflow inherits the repository default,
# so if that default is ever set to read+write, every PR-triggered job (all of
# which run `npm ci` and arbitrary test/build code) would get a write token.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['landing/**', 'scripts/laya-gate.py']
  pull_request:
    branches: [main]
    paths: ['landing/**', 'scripts/laya-gate.py']

jobs:
  laya-gate:
    name: Laya deterministic audit (stdlib only, <30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # No deps: scripts/laya-gate.py is stdlib-only (no torch, no weights).
      # Full Laya judgments run locally via Developer/laya-audit/audit.py;
      # every MCP-server decision is logged to decisions.jsonl for the
      # fine-tune flywheel (log first, LLM labels later).
      - run: python scripts/laya-gate.py landing
