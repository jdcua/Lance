name: Security

# OWASP Top 10:2025 A03 (Software Supply Chain Failures) and A08 (Software or
# Data Integrity Failures). This is the gate that makes the rest of the
# security posture hold, without it, a CVE in any transitive dependency merges
# silently, which is exactly how a HIGH advisory in the Tiptap editor
# (@tiptap/core prototype pollution, user-visible in the built bundle) survived
# in this repo until 2026-10-02.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 05:37 UTC. Catches advisories published over the weekend, which a
    # push/PR-only gate would not see until the next commit.
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    timeout-minutes: 10
    name: npm audit (shipped dependencies)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: nothing in this job builds a native binding, so deny
      # every install script outright. The release job still runs them (and
      # needs fsevents on macOS), see release.yml.
      - run: npm ci --ignore-scripts

      # Prod tree only, hard gate. Shipping a high/critical advisory to users is
      # the failure that matters; gating the dev tree as well just trains people
      # to reach for `npm audit fix --force`, which is how @tiptap/core got
      # pinned below its own advisory floor in the first place.
      - name: No high or critical advisory in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tree: reported, never blocking. A new dev advisory should be visible
      # in the run summary without being a merge blocker.
      - name: Summarise dev-only advisories (non-blocking)
        run: |
          npm audit --json > /tmp/audit-dev.json || true
          node -e '
            const j = require("/tmp/audit-dev.json");
            const m = (j.metadata || {}).vulnerabilities || {};
            const rows = Object.values(j.vulnerabilities || {})
              .map((v) => `| \`${v.name}\` | ${v.severity} | ${v.isDirect ? "direct" : "transitive"} |`)
              .join("\n");
            require("fs").appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              "### npm audit, development tree (non-blocking)\n\n" +
                `critical ${m.critical || 0} · high ${m.high || 0} · moderate ${m.moderate || 0} · low ${m.low || 0}\n\n` +
                (rows ? `| package | severity | scope |\n|---|---|---|\n${rows}\n` : "Clean.\n"),
            );
          '

  cargo-audit:
    timeout-minutes: 20
    name: cargo audit (lockfile-accurate)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # cargo tree --locked and cargo audit do not compile Tauri's native
      # dependencies, so the webkit/appindicator apt set is unnecessary here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: security
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Without --locked, cargo silently re-resolves the graph whenever the
      # lockfile's own version drifts from Cargo.toml, so the lockfile you audit
      # stops being the lockfile you build. --locked turns that drift into a
      # build failure. This caught a real incident: a `cargo tree` invocation
      # during the 2026-10-02 audit rewrote Cargo.lock in place.
      - name: Cargo.lock is in sync with Cargo.toml
        working-directory: src-tauri
        run: cargo tree --locked --depth 0

      # NOTE: no rustsec/audit-check action step here on purpose. It was
      # removed 2026-10-05 after failing every Security run two ways: first it
      # scanned ./Cargo.lock at the repo root (workspace is in src-tauri),
      # then, pointed at the right lockfile, it (a) needs checks:write to post
      # its check run, which this least-privilege workflow does not grant, and
      # (b) hard-fails on ANY advisory with no way to express
      # "allowlisted, no patch exists" — our two advisories (rsa, sqlx) would
      # keep it red forever. The Advisory gate below is the actual gate: it
      # reasons about patch availability and validates the allowlist itself
      # (an `ignore:` input would be additive and silent — it never fails on
      # an entry that stopped being vulnerable, which is how audit gates
      # decay into decoration).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Advisory gate
        working-directory: src-tauri
        run: |
          cargo audit --json > /tmp/cargo-audit.json || true
          node ../.github/security/check-cargo-audit.mjs \
            /tmp/cargo-audit.json \
            ../.github/security/cargo-audit-allow.json \
            "${GITHUB_STEP_SUMMARY}"

  xlsx-pin:
    timeout-minutes: 10
    name: xlsx tarball is hash-pinned
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # `xlsx` resolves from a CDN tarball, not the npm registry, because
      # SheetJS moved off npm. package-lock.json carries an integrity hash so
      # `npm ci` verifies the bytes, but that hash lives in the lockfile, so
      # anyone who can change package.json can change the hash in the same
      # commit. check-xlsx-pin.mjs keeps a second copy of the expected hash in
      # .github/security/xlsx-integrity.txt and fails if the lockfile drifts
      # from it, so changing the tarball requires a separate, reviewed file.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node .github/security/check-xlsx-pin.mjs

  gitleaks:
    timeout-minutes: 10
    name: gitleaks (full history)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is what makes full-history scanning possible. The
      # action runs `gitleaks detect` without log-opts on schedule/dispatch
      # (all commits) and over the commit range on push/PR (fast path). A
      # shallow checkout would leave older commits invisible to git log.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Pinned to the commit behind the v3.0.0 release, not the moving v3 tag.
      # v3 uses the Node 24 runtime; v2 (Node 20) no longer runs on
      # GitHub-hosted runners. refs/tags/v3.0.0 resolves to this exact SHA.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_CONFIG: .github/workflows/gitleaks.toml
          # PR comments need pull-requests: write and SARIF upload needs
          # actions: write. Both are off: this job is contents: read only.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Only organizations need a license key. Harmless when unset for
          # this personal-account repo; set the secret before any move to an org.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
