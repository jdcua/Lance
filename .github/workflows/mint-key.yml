name: Mint LANCE key

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Mint key
        env:
          LANCE_LICENSE_SECRET: ${{ secrets.LANCE_LICENSE_SECRET }}
        run: |
          cat > /tmp/mint.mjs <<'EOF'
          const { Worker, isMainThread, parentPort, workerData } = require('worker_threads');
          const crypto = require('crypto');
          const os = require('os');
          const LICENSE_PRIME = 999999937n;
          const ALLOWED = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
          function deriveH(secret){const h=crypto.createHash('sha256').update(secret,'utf8').digest();return h.subarray(0,16).toString('hex').toUpperCase();}
          function checkBody(body,hmacKey){const sig=crypto.createHmac('sha256',hmacKey).update(body,'utf8').digest();return sig.readBigUInt64BE(0)%LICENSE_PRIME===0n;}
          function randomBody(){const bytes=crypto.randomBytes(16);let s='';for(let i=0;i<16;i++)s+=ALLOWED[bytes[i]%ALLOWED.length];return `${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8,12)}-${s.slice(12,16)}`;}
          if(!isMainThread){const hmacKey=Buffer.from(workerData.h,'utf8');let tries=0;for(;;){const body=randomBody();tries++;if(checkBody(body.replaceAll('-',''),hmacKey)){parentPort.postMessage({key:`LANCE-${body}`,tries});return;}if(tries%2000000===0)parentPort.postMessage({progress:tries});}}
          (async()=>{
            const secret=process.env.LANCE_LICENSE_SECRET;
            if(!secret){console.error('no secret');process.exit(1);}
            const h=deriveH(secret);
            const threads=os.cpus().length;
            let totalTries=0;const t0=Date.now();
            const key=await new Promise((resolve)=>{const workers=[];const done=(k)=>{for(const w of workers)w.terminate();resolve(k);};for(let i=0;i<threads;i++){const w=new Worker(__filename,{workerData:{h}});workers.push(w);w.on('message',(m)=>{if(m.key)done(m.key);else totalTries+=m.progress;});}});
            console.log('MINTED_KEY='+key);
            require('fs').writeFileSync('/tmp/minted-key.txt', key);
          })();
          EOF
          LANCE_LICENSE_SECRET="$LANCE_LICENSE_SECRET" node /tmp/mint.mjs
      - name: Upload key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minted-key
          path: /tmp/minted-key.txt