name: CI

# Explicit read-only. Without this the workflow inherits the repository default,
# so if that default is ever set to read+write, every PR-triggered job (all of
# which run `npm ci` and arbitrary test/build code) would get a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  typecheck:
    timeout-minutes: 15
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Playwright spec typecheck
        run: npm run typecheck:e2e

  lint:
    timeout-minutes: 15
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Duplicate function advisory
        run: "npx eslint src/ --rule 'sonarjs/no-identical-functions: warn'"
      - name: Complexity gate
        run: npm run complexity -- --strict
      - name: Strict architecture boundaries
        run: npm run check:boundaries -- --strict
      - name: Import cycle baseline
        run: npm run check:boundaries -- --cycles
      - name: No new hand-rolled trackers
        run: npm run check:trackers
      - name: Open-source audit
        run: npm run audit:oss
      - name: Dependency license policy
        run: npm run check:licenses

  test:
    timeout-minutes: 15
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rust-check:
    timeout-minutes: 15
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --lib
        working-directory: src-tauri

      - name: Rust format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy quality lints
        run: cargo clippy --lib -- -D clippy::excessive_nesting -D clippy::too_many_lines -D clippy::too_many_arguments -D clippy::type_complexity
        working-directory: src-tauri

  rust-test:
    timeout-minutes: 15
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --lib
        working-directory: src-tauri

  build:
    timeout-minutes: 15
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    timeout-minutes: 20
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=github
