name: promo

# Explicit read-only. Without this the workflow inherits the repository default,
# so if that default is ever set to read+write, every PR-triggered job (all of
# which run `npm ci` and arbitrary test/build code) would get a write token.
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # weekly Monday draft refresh
  push:
    paths:
      - 'promo/**'
      - 'scripts/promo/**'

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm run promo:build
      - run: npm run promo:exp-eval || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promo-bundle
          path: |
            promo/drafts
            promo/.build-meta.json
            landing/craft
            landing/alternatives
            landing/variants
            landing/launch-config.js
