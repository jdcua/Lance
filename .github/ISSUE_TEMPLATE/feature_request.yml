name: Feature request
description: Suggest a capability or an improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the freelancer workflow that is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Lance do instead? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try, and why was it not enough?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require an account, cloud service, or telemetry
          required: true
